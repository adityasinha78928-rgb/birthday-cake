<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% 30%, #38204f, transparent 55%),
    linear-gradient(160deg, #110b22, #080711);
}

.container {
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 35px 18px 40px;
  text-align: center;
}

h1 {
  font-size: clamp(30px, 8vw, 48px);
  margin-bottom: 12px;
  background: linear-gradient(90deg, #ff91d5, #ffd5ef);
  -webkit-background-clip: text;
  color: transparent;
}

.subtitle {
  font-size: 16px;
  color: #ddd0e9;
  margin-bottom: 35px;
}

.cake-area {
  position: relative;
  width: 100%;
  height: 330px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.cake {
  position: relative;
  width: 310px;
  height: 190px;
  margin-bottom: 25px;
  filter: drop-shadow(0 20px 18px rgba(0,0,0,.5));
}

.layer {
  position: absolute;
  left: 0;
  width: 310px;
  height: 65px;
  border-radius: 50%;
  border: 3px solid #ffd8ed;
  background: linear-gradient(#ffb7d9, #e979b4);
}

.layer::after {
  content: "";
  position: absolute;
  left: -3px;
  top: 30px;
  width: 310px;
  height: 58px;
  border: 3px solid #ffd8ed;
  border-radius: 0 0 50% 50%;
  background: linear-gradient(#ee91bf, #cb599b);
  z-index: -1;
}

.bottom {
  bottom: 0;
}

.middle {
  bottom: 58px;
  transform: scale(.88);
}

.top {
  bottom: 116px;
  transform: scale(.76);
}

.cream {
  position: absolute;
  top: 23px;
  left: 0;
  width: 100%;
  height: 16px;
  border-radius: 50%;
  background: #fff0f8;
}

.frosting {
  position: absolute;
  top: -5px;
  left: 0;
  width: 100%;
  height: 25px;
  border-radius: 50%;
  background: #fff0f8;
}

.cherry {
  position: absolute;
  top: 10px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ff315f;
  box-shadow: inset -4px -3px 0 #c91c48;
}

.cherry:nth-child(1) {
  left: 45px;
}

.cherry:nth-child(2) {
  left: 145px;
}

.cherry:nth-child(3) {
  left: 245px;
}

/* Candles sit on the top cake layer */

.candle {
  position: absolute;
  bottom: 168px;
  width: 18px;
  height: 70px;
  border-radius: 5px;
  background: repeating-linear-gradient(
    135deg,
    #fff,
    #fff 8px,
    #b9a1ff 8px,
    #b9a1ff 16px
  );
  z-index: 10;
}

.candle:nth-child(1) {
  left: 78px;
}

.candle:nth-child(2) {
  left: 146px;
}

.candle:nth-child(3) {
  left: 214px;
}

.wick {
  position: absolute;
  top: -9px;
  left: 7px;
  width: 4px;
  height: 10px;
  background: #29202a;
}

.flame {
  position: absolute;
  top: -43px;
  left: -4px;
  width: 26px;
  height: 40px;
  border-radius: 50% 50% 50% 50%;
  background: linear-gradient(#fff8ae, #ffae00, #ff4c00);
  box-shadow: 0 0 25px #ff9d00;
  animation: flicker .16s infinite alternate;
  transform-origin: bottom;
}

@keyframes flicker {
  from {
    transform: scale(1) rotate(-3deg);
  }
  to {
    transform: scale(1.12) rotate(3deg);
  }
}

.flame.off {
  display: none;
}

.table {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(#8c4c76, #40233f);
  box-shadow: 0 15px 35px rgba(0,0,0,.5);
}

button {
  border: none;
  border-radius: 35px;
  padding: 17px 30px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #ff54b5, #9b58ff);
  box-shadow: 0 10px 30px rgba(220,70,220,.3);
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

button:disabled {
  opacity: .7;
}

#status {
  margin-top: 20px;
  min-height: 22px;
  color: #d9c9ee;
  font-size: 14px;
}

#message {
  display: none;
  margin-top: 22px;
  animation: appear 1s ease;
}

#message h2 {
  color: #ffd1ec;
  font-size: 28px;
  margin-bottom: 10px;
}

#message p {
  color: #e5d7f3;
  line-height: 1.6;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.confetti {
  position: fixed;
  top: -20px;
  width: 8px;
  height: 14px;
  animation: fall 3s linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

@media (max-width: 380px) {
  .cake {
    transform: scale(.82);
    transform-origin: bottom center;
  }

  .cake-area {
    height: 290px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Happy Birthday! 🎂</h1>

  <p class="subtitle">
    Make a wish and blow out the candles ✨
  </p>

  <div class="cake-area">

    <div class="cake">

      <div class="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>

      <div class="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>

      <div class="candle">
        <div class="wick"></div>
        <div class="flame"></div>
      </div>

      <div class="layer bottom">
        <div class="cream"></div>
      </div>

      <div class="layer middle">
        <div class="cream"></div>
      </div>

      <div class="layer top">
        <div class="frosting"></div>
        <div class="cherry"></div>
        <div class="cherry"></div>
        <div class="cherry"></div>
      </div>

    </div>

    <div class="table"></div>

  </div>

  <button id="blowButton">
    🎤 Blow Out Candles
  </button>

  <p id="status">
    Tap the button and blow into your microphone.
  </p>

  <div id="message">
    <h2>Wish Granted! 🎉</h2>
    <p>
      May your birthday be filled with happiness,
      love and beautiful memories.
    </p>
  </div>

</div>

<script>
const button = document.getElementById("blowButton");
const statusText = document.getElementById("status");
const message = document.getElementById("message");
const flames = document.querySelectorAll(".flame");

let audioContext;
let analyser;
let microphone;
let blown = false;

function celebrate() {
  if (blown) return;

  blown = true;

  flames.forEach(flame => {
    flame.classList.add("off");
  });

  button.disabled = true;
  button.textContent = "🎉 Candles Blown Out!";
  statusText.textContent = "Your wish has been sent into the universe ✨";
  message.style.display = "block";

  createConfetti();
}

function createConfetti() {
  for (let i = 0; i < 70; i++) {
    const piece = document.createElement("div");

    piece.className = "confetti";

    piece.style.left = Math.random() * 100 + "vw";

    piece.style.background = [
      "#ff65b5",
      "#ffd166",
      "#8ecae6",
      "#b8f2e6",
      "#c77dff"
    ][Math.floor(Math.random() * 5)];

    piece.style.animationDelay = Math.random() * 1.5 + "s";

    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 5000);
  }
}

async function startMicrophone() {
  if (blown) return;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusText.textContent =
      "Microphone is unavailable. Tap again to blow out the candles.";

    button.onclick = celebrate;
    return;
  }

  try {
    statusText.textContent = "Allow microphone access, then blow!";

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (window.AudioContext ||
      window.webkitAudioContext)();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.2;

    microphone = audioContext.createMediaStreamSource(stream);
    microphone.connect(analyser);

    const data = new Uint8Array(analyser.fftSize);

    let baseline = 0;
    let loudFrames = 0;

    function detectBlow() {
      if (blown) return;

      analyser.getByteTimeDomainData(data);

      let sum = 0;

      for (let i = 0; i < data.length; i++) {
        const value = (data[i] - 128) / 128;
        sum += value * value;
      }

      const volume = Math.sqrt(sum / data.length);

      baseline = baseline * 0.95 + volume * 0.05;

      const threshold = Math.max(0.045, baseline * 2.5);

      if (volume > threshold && volume > 0.07) {
        loudFrames++;
      } else {
        loudFrames = 0;
      }

      if (loudFrames >= 3) {
        celebrate();

        stream.getTracks().forEach(track => track.stop());

        if (audioContext) {
          audioContext.close();
        }

        return;
      }

      requestAnimationFrame(detectBlow);
    }

    detectBlow();

  } catch (error) {
    statusText.textContent =
      "Microphone unavailable. Tap the button to blow out the candles.";

    button.textContent = "🕯️ Tap to Blow Out";
    button.onclick = celebrate;
  }
}

button.addEventListener("click", startMicrophone);
</script>

</body>
</html>
